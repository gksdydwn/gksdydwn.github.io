<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="560" height="260" role="img" aria-label="Git 이름표 관계도: HEAD, main, origin/main, origin/HEAD의 관계">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93a3b8"/>
    </marker>
    <style>
      .box-blue  { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
      .box-gray  { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
      .box-cmt   { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .lbl-code  { font: 700 13px 'Cascadia Mono',Consolas,monospace; fill: #1d4ed8; }
      .lbl-gray  { font: 700 13px 'Cascadia Mono',Consolas,monospace; fill: #1f2937; }
      .note      { font: 400 11px 'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #6b7280; }
      .note-dark { font: 700 11px 'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #1f2937; }
      .line      { stroke: #93a3b8; stroke-width: 1.5; }
      .msg       { font: 400 13px 'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; fill: #1f2937; }
    </style>
  </defs>

  <!-- 로컬 브랜치 및 HEAD 경로 -->
  <rect class="box-blue" x="20" y="30" width="115" height="40" rx="6"/>
  <text class="lbl-code" x="77.5" y="55" text-anchor="middle">HEAD</text>
  <text class="note" x="77.5" y="85" text-anchor="middle">내가 선 곳</text>

  <line class="line" x1="135" y1="50" x2="189" y2="50" marker-end="url(#arrowA)"/>

  <rect class="box-blue" x="195" y="30" width="115" height="40" rx="6"/>
  <text class="lbl-code" x="252.5" y="55" text-anchor="middle">main</text>
  <text class="note" x="252.5" y="85" text-anchor="middle">내 브랜치</text>

  <line class="line" x1="310" y1="50" x2="382" y2="92" marker-end="url(#arrowA)"/>

  <!-- 원격 저장소 경로 -->
  <rect class="box-gray" x="20" y="140" width="115" height="40" rx="6"/>
  <text class="lbl-gray" x="77.5" y="165" text-anchor="middle">origin/HEAD</text>
  <text class="note" x="77.5" y="195" text-anchor="middle">깃허브 기본 브랜치</text>

  <line class="line" x1="135" y1="160" x2="189" y2="160" marker-end="url(#arrowA)"/>

  <rect class="box-gray" x="195" y="140" width="115" height="40" rx="6"/>
  <text class="lbl-gray" x="252.5" y="165" text-anchor="middle">origin/main</text>
  <text class="note" x="252.5" y="195" text-anchor="middle">깃허브 사본</text>

  <line class="line" x1="310" y1="160" x2="382" y2="118" marker-end="url(#arrowA)"/>

  <!-- 최종 커밋 노드 (알약 모양) -->
  <rect class="box-cmt" x="390" y="85" width="145" height="44" rx="22"/>
  <text class="lbl-code" x="462.5" y="111" text-anchor="middle">b536005</text>
  <text class="note-dark" x="462.5" y="145" text-anchor="middle">실제 커밋 (변하지 않음)</text>

  <!-- 핵심 하단 설명 메시지 -->
  <text class="msg" x="280" y="235" text-anchor="middle">HEAD는 브랜치를 거쳐 가리키고, origin/main은 커밋을 직접 가리킨다.</text>
</svg>
